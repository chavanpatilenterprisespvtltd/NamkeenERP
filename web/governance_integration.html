<!doctype html><html><head><meta charset="utf-8"><title>Governance Integration</title><style>body{font-family:Arial,sans-serif;margin:32px}h1{margin-bottom:8px}.card{border:1px solid #ddd;border-radius:10px;padding:16px;margin:12px 0}code{background:#f4f4f4;padding:2px 4px;border-radius:4px}</style></head><body><h1>ERP Transaction Governance Integration</h1><p>Cross-module policy-driven transaction governance built on V90.fo and V90.fn.</p><div class="card"><b>Default mode</b><p>Core POST transaction routes are covered in <code>AUDIT_ONLY</code> mode. Specific route policies can be promoted to <code>REQUIRE_APPROVAL</code>.</p></div><div id="data" class="card">Loading coverage…</div><script>fetch('/v90fp/governance/coverage',{credentials:'same-origin'}).then(r=>r.json()).then(x=>{document.getElementById('data').innerHTML='<b>Modules covered:</b> '+x.modules.length+'<br><b>Events:</b> '+(x.events.total_events||0)+'<br><b>Blocked:</b> '+(x.events.blocked_events||0)+'<br><b>Successful:</b> '+(x.events.successful_events||0)}).catch(()=>document.getElementById('data').textContent='Unable to load coverage.')</script></body></html>
