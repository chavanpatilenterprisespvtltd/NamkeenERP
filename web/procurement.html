<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procurement</title><style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#18212f}.wrap{max-width:1100px;margin:auto;padding:24px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0}.kpi{min-width:150px}.num{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}nav a{margin-right:14px}</style></head><body><div class="wrap"><nav><a href="/ui/management">Management</a><a href="/ui/products">Products</a><a href="/ui/recipes">Recipes</a><a href="/ui/procurement">Procurement</a></nav><h1>Procurement</h1><div class="card"><p><input id="o" placeholder="Organization UUID" size="38"> <input id="e" placeholder="Entity UUID" size="38"> <input id="l" placeholder="Location UUID" size="38"> <button onclick="load()">Load</button></p></div><div id="kpis" class="cards"></div><div id="out" class="card"></div></div><script>async function load(){let r=await fetch('/v90bm/procurement?organization_id='+encodeURIComponent(o.value)+'&entity_id='+encodeURIComponent(e.value)+'&location_id='+encodeURIComponent(l.value),{headers:{Authorization:'Bearer '+(localStorage.getItem('erp_token')||'')}});let j=await r.json();kpis.innerHTML=Object.entries(j.counts).map(([k,v])=>'<div class="card kpi"><div>'+k.replaceAll('_',' ')+'</div><div class="num">'+v+'</div></div>').join('');out.innerHTML='<h2>Recent Purchase Orders</h2><table><tr><th>PO</th><th>Date</th><th>Expected</th><th>Status</th><th>Supplier</th></tr>'+j.purchase_orders.map(x=>'<tr><td>'+x.po_no+'</td><td>'+x.po_date+'</td><td>'+x.expected_date+'</td><td>'+x.status+'</td><td>'+x.supplier_id+'</td></tr>').join('')+'</table>'}</script></body></html>
