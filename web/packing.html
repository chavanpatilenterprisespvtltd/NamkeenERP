<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packing / FG | Namkeen ERP</title><link rel="stylesheet" href="/web/assets/app.css"></head><body><main class="shell"><header><div><h1>Packing / Finished Goods</h1><span class="muted">Packing runs, packed FG lots and packing QC</span></div><a class="pill" href="/web">ERP Home</a></header><section class="card"><form id="f"><input id="o" placeholder="Organization ID" required><input id="e" placeholder="Entity ID" required><input id="l" placeholder="Location ID" required><button>Load Packing</button></form><p id="err" class="error"></p></section><section id="kpi" class="metric-grid"></section><section class="grid"><article><h2>Packing Runs</h2><div id="runs" class="list"></div></article><article><h2>Packed FG Lots</h2><div id="lots" class="list"></div></article><article><h2>Packing QC</h2><div id="qc" class="list"></div></article></section></main><script>const $=x=>document.getElementById(x),token=localStorage.getItem('erp_token')||sessionStorage.getItem('erp_token')||'';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));async function get(path,p){const r=await fetch(path+'?'+p,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Load failed');return d}$('f').addEventListener('submit',async ev=>{ev.preventDefault();$('err').textContent='';try{const p=new URLSearchParams({organization_id:$('o').value,entity_id:$('e').value,location_id:$('l').value});const [s,r,l,q]=await Promise.all([get('/v90bp/packing/summary',p),get('/v90bp/packing/runs',p),get('/v90bp/packing/lots',p),get('/v90bp/packing/qc',p)]);$('kpi').innerHTML=Object.entries(s.counts).map(([k,v])=>`<div class="card metric"><div class="metric-label">${esc(k.replaceAll('_',' '))}</div><div class="metric-value">${esc(v)}</div></div>`).join('');$('runs').innerHTML=r.items.map(x=>`<div class="list-item"><strong>${esc(x.run_no)} · ${esc(x.status)}</strong><small>SKU ${esc(x.sku_id)} · ${esc(x.source_qty)} → ${esc(x.packed_qty)}</small></div>`).join('')||'<div class="empty">No packing runs.</div>';$('lots').innerHTML=l.items.map(x=>`<div class="list-item"><strong>${esc(x.lot_code)} · ${esc(x.qc_status)}</strong><small>${esc(x.net_qty)} ${esc(x.uom)} · available ${esc(x.available_qty)}</small><small>Expiry ${esc(x.expiry_date||'—')}</small></div>`).join('')||'<div class="empty">No packed FG lots.</div>';$('qc').innerHTML=q.items.map(x=>`<div class="list-item"><strong>${esc(x.overall_status)}</strong><small>Lot ${esc(x.packed_fg_lot_id)} · seal ${esc(x.seal_status||'—')} · label ${esc(x.label_status||'—')} · N₂ ${esc(x.nitrogen_status||'—')}</small><small>${esc(x.hold_reason||'')}</small></div>`).join('')||'<div class="empty">No packing QC records.</div>'}catch(e){$('err').textContent=e.message}});</script></body></html>
