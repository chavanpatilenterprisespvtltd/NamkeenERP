<!doctype html><html><head><meta charset="utf-8"><title>ERP Operational Observability</title><style>body{font-family:system-ui;margin:32px;max-width:1100px}button{padding:8px 14px}pre{background:#f5f5f5;padding:16px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #ddd;border-radius:8px;padding:14px}</style></head><body><h1>Operational Observability & SLA Control</h1><p>Health, alerts, incidents and evidence-backed operational closure.</p><button onclick="load()">Refresh dashboard</button><div id="cards" class="grid"></div><pre id="out">Loading…</pre><script>async function load(){const h={'Authorization':localStorage.getItem('erp_token')?'Bearer '+localStorage.getItem('erp_token'):''};const r=await fetch('/v90fx/dashboard',{headers:h});const d=await r.json();document.getElementById('cards').innerHTML=[['Healthy',d.operationally_healthy],['Open alerts',d.open_alerts],['Critical alerts',d.critical_open_alerts],['Open incidents',d.open_incidents]].map(x=>`<div class="card"><b>${x[0]}</b><div>${x[1]}</div></div>`).join('');document.getElementById('out').textContent=JSON.stringify(d,null,2)}load()</script></body></html>
