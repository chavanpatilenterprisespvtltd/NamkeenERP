<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP · Dispatch</title><style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f7fa;color:#152033}header{background:#10253f;color:#fff;padding:20px 28px}main{max-width:1200px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:16px;box-shadow:0 2px 8px #00000008}.num{font-size:28px;font-weight:700;margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}select,input,button{padding:9px 11px;border:1px solid #ccd4df;border-radius:8px;background:#fff}button{cursor:pointer}table{width:100%;border-collapse:collapse;background:#fff}.wrap{overflow:auto;border:1px solid #e1e6ee;border-radius:12px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;white-space:nowrap}.muted{color:#65748b}.status{font-weight:600}
</style></head><body><header><strong>Namkeen ERP</strong><div>Dispatch Operations · V90.bs</div></header><main><div class="toolbar"><input id="org" placeholder="Organization ID"><input id="entity" placeholder="Entity ID"><input id="location" placeholder="Location ID"><select id="status"><option value="">All statuses</option><option>DRAFT</option><option>POSTED</option><option>CANCELLED</option></select><button onclick="loadAll()">Refresh</button></div><div class="grid" id="kpis"></div><h2>Dispatch Queue</h2><div class="wrap"><table><thead><tr><th>Dispatch</th><th>Status</th><th>Sales Order</th><th>Qty</th><th>Transporter</th><th>Vehicle</th><th>POD</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="muted">Authenticate in the ERP shell and enter scope IDs.</td></tr></tbody></table></div><h2>Open Backorders</h2><div class="wrap"><table><thead><tr><th>Sales Order</th><th>SKU</th><th>Ordered</th><th>Dispatched</th><th>Backorder</th><th>Reason</th></tr></thead><tbody id="backorders"><tr><td colspan="6" class="muted">No data loaded.</td></tr></tbody></table></div></main><script>
const token=()=>localStorage.getItem('erp_access_token')||sessionStorage.getItem('erp_access_token')||''; const q=()=>`organization_id=${encodeURIComponent(document.getElementById('org').value)}&entity_id=${encodeURIComponent(document.getElementById('entity').value)}&location_id=${encodeURIComponent(document.getElementById('location').value)}`;
async function get(path){const r=await fetch(path,{headers:{Authorization:`Bearer ${token()}`}});if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadAll(){try{const s=await get('/v90bs/dispatch/summary?'+q());const c=s.counts;document.getElementById('kpis').innerHTML=Object.entries(c).map(([k,v])=>`<div class="card"><div class="muted">${k.replaceAll('_',' ')}</div><div class="num">${Number(v).toLocaleString()}</div></div>`).join('');const status=document.getElementById('status').value;const data=await get('/v90bs/dispatch/queue?'+q()+(status?'&status='+status:''));document.getElementById('rows').innerHTML=data.items.map(x=>`<tr><td>${x.dispatch_no||x.dispatch_id}</td><td class="status">${x.status}</td><td>${x.sales_order_id}</td><td>${x.dispatched_qty}</td><td>${x.assignment?.transporter_name||x.transporter||''}</td><td>${x.assignment?.vehicle_no||x.vehicle_no||''}</td><td>${x.pod?.status||'—'}</td></tr>`).join('')||'<tr><td colspan="7">No dispatches.</td></tr>';const bo=await get('/v90bs/dispatch/backorders?'+q());document.getElementById('backorders').innerHTML=bo.items.map(x=>`<tr><td>${x.sales_order_id}</td><td>${x.sku_id}</td><td>${x.ordered_qty}</td><td>${x.dispatched_qty}</td><td>${x.backorder_qty}</td><td>${x.reason||''}</td></tr>`).join('')||'<tr><td colspan="6">No open backorders.</td></tr>'}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="7">${e.message}</td></tr>`}}
</script></body></html>
