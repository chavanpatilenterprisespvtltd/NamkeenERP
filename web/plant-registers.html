<!-- FILE PATH: web/plant-registers.html -->
<!-- Plant Registers screen v1.0 (Session CS2 — new: oil, fuel, electricity/water, cartons, complaints, purchase returns, daily summary) -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plant Registers | Namkeen ERP</title>
<link rel="stylesheet" href="/web/assets/app.css">
<style>form.wide{max-width:none}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}label{display:grid;gap:4px;font-size:13px;color:#374151;min-width:0}select,textarea{width:100%;min-width:0;font:inherit;padding:10px;border-radius:8px;border:1px solid #d1d5db;background:#fff}.ok{color:#047857}.tabs{flex-wrap:wrap}.row{display:flex;gap:6px;margin-top:6px}</style></head>
<body><main class="shell">
<header><div><h1>Plant Registers</h1><span class="muted">Daily entries for the factory — business date can be yesterday (night shift)</span></div><a class="pill" href="/ui/daily-work">Daily work</a></header>
<section class="card"><div class="two"><label>Organization<select id="org"></select></label><label>Company / entity<select id="ent"></select></label><label>Location<select id="loc"></select></label><label>Business date<input id="bdate" type="date"></label><label>Shift<select id="shift"><option value="">—</option><option>A</option><option>B</option><option>C</option><option>NIGHT</option></select></label></div></section>
<nav class="tabs" style="margin-top:16px" id="tabs"></nav>
<section class="card" id="panel"></section>
<section class="card" style="margin-top:16px"><div class="toolbar"><h2>Records</h2><button id="reload">Refresh</button></div><div id="list" class="list"></div></section>
</main>
<script src="/web/assets/erp-forms.js"></script>
<script>
const $=id=>document.getElementById(id), E=ERP; let S=null, ITEMS=[], tab='oil';
$('bdate').value=new Date().toISOString().slice(0,10);
const F={
 oil:{title:'Frying oil',post:'/v90gx/plant/oil-log',list:'oil',fields:`<label>Fryer<input name="fryer_id" required value="FRYER-1"></label><label>Opening litres<input name="opening_litres" type="number" step="0.1" required></label><label>Topped up litres<input name="topped_up_litres" type="number" step="0.1" value="0"></label><label>Discarded litres<input name="discarded_litres" type="number" step="0.1" value="0"></label><label>Closing litres<input name="closing_litres" type="number" step="0.1" required></label><label>Frying temp °C<input name="frying_temp_c" type="number"></label><label>TPM % (limit 25)<input name="tpm_pct" type="number" step="0.1"></label>`,show:x=>`${x.fryer_id} · used ${x.consumed_litres} L · TPM ${x.tpm_pct??'—'}% · ${x.status}`},
 fuel:{title:'Fuel / wood',post:'/v90gx/plant/fuel-log',list:'fuel',fields:`<label>Fuel<select name="fuel_type"><option>WOOD</option><option>LPG</option><option>DIESEL</option><option>PNG</option><option>BRIQUETTE</option><option>COAL</option><option>OTHER</option></select></label><label>Machine<input name="machine_id"></label><label>Quantity<input name="quantity" type="number" step="0.01" required></label><label>UOM<select name="uom"><option>kg</option><option>litre</option><option>scm</option><option>tonne</option></select></label><label>Rate ₹<input name="rate" type="number" step="0.01" value="0"></label>`,show:x=>`${x.fuel_type} ${x.quantity} ${x.uom} · ₹${x.amount}`},
 utility:{title:'Electricity / water',post:'/v90gx/plant/utility-log',list:'utility',fields:`<label>Type<select name="utility_type"><option>ELECTRICITY</option><option>WATER</option><option>STEAM</option><option>OTHER</option></select></label><label>Meter<input name="meter_id" required value="MSEDCL-1"></label><label>Opening reading<input name="opening_reading" type="number" step="0.01" required></label><label>Closing reading<input name="closing_reading" type="number" step="0.01" required></label><label>Rate ₹/unit<input name="rate" type="number" step="0.01" value="0"></label>`,show:x=>`${x.utility_type} ${x.meter_id} · ${x.units} units · ₹${x.amount}`},
 cartons:{title:'Cartons',post:'/v90gx/plant/carton-consumption',list:'cartons',fields:`<label>SKU<select name="sku_id" class="items" required></select></label><label>Packs packed<input name="packs_packed" type="number" required></label><label>Packs per carton<input name="packs_per_carton" type="number" required value="20"></label><label>Cartons used<input name="cartons_used" type="number" required></label>`,show:x=>`${x.packs_packed} packs · expected ${x.expected_cartons} · used ${x.cartons_used} · variance ${x.variance_cartons}`},
 complaint:{title:'Customer complaint',post:'/v90gx/complaints',fields:`<label>Customer name<input name="customer_name" required></label><label>Phone<input name="contact_phone"></label><label>SKU<select name="sku_id" class="items"></select></label><label>Lot / batch code<input name="lot_code"></label><label>Category<select name="category"><option>QUALITY</option><option>TASTE</option><option>FOREIGN_MATTER</option><option>SPOILAGE</option><option>ILLNESS</option><option>PACKAGING</option><option>SHORT_WEIGHT</option><option>EXPIRY</option><option>DELIVERY</option><option>OTHER</option></select></label><label>Severity<select name="severity"><option>MEDIUM</option><option>LOW</option><option>HIGH</option></select></label><label style="grid-column:1/-1">Description<textarea name="description" required minlength="5"></textarea></label>`},
 preturn:{title:'Purchase return',post:'/v90gx/purchase-returns',fields:`<label>Warehouse<select name="warehouse_id" id="wh" required></select></label><label>Supplier<select name="supplier_id" id="sup" required></select></label><label>GRN id (optional)<input name="grn_id"></label><label>Reason<select name="reason"><option>QC_REJECTED</option><option>DAMAGED</option><option>EXCESS</option><option>WRONG_ITEM</option><option>EXPIRED</option><option>OTHER</option></select></label><label>Item<select name="item_master_id" class="items" required></select></label><label>Lot id<input name="lot_id"></label><label>Quantity<input name="quantity" type="number" step="0.001" required></label><label>UOM<input name="uom" value="kg" required></label><label>Rate ₹<input name="rate" type="number" step="0.01" required></label><label>GST %<input name="gst_rate" type="number" step="0.01" value="5"></label>`},
 summary:{title:'Daily summary'}
};
function tabs(){ $('tabs').innerHTML=Object.entries(F).map(([k,v])=>`<button class="${k===tab?'active':''}" data-tab="${k}">${v.title}</button>`).join('') }
function scopeBody(){return {organization_id:$('org').value,entity_id:$('ent').value,location_id:$('loc').value,business_date:$('bdate').value||undefined,shift_code:$('shift').value||undefined}}
function panel(){
  const f=F[tab]; tabs();
  if(tab==='summary'){$('panel').innerHTML='<p class="muted">Totals for the selected company and business date.</p>';return list()}
  $('panel').innerHTML=`<h2>${f.title}</h2><form id="form" class="wide"><div class="two">${f.fields}<label>Notes<input name="notes"></label></div><div><button>Save</button> <span id="msg"></span></div></form>`;
  document.querySelectorAll('select.items').forEach(s=>E.fillSelect(s,ITEMS,'id',x=>`${x.type}: ${x.label}`,s.required?null:'(none)'));
  if(tab==='preturn'){E.fillSelect($('wh'),S.warehouses.filter(w=>w.entity_id===$('ent').value),'warehouse_id',w=>w.warehouse_code+' — '+w.warehouse_name);E.api('GET',`/v90gx/lookups/items?organization_id=${$('org').value}&master_type=SUPPLIER`).then(d=>E.fillSelect($('sup'),d.items,'id',x=>x.label)).catch(()=>{})}
  $('form').addEventListener('submit',save); list();
}
async function save(ev){ev.preventDefault();const m=$('msg');try{const b=E.formData($('form'));let body;
  if(tab==='complaint'){body={organization_id:$('org').value,entity_id:$('ent').value,complaint_date:$('bdate').value,...b}}
  else if(tab==='preturn'){const line={item_master_id:b.item_master_id,lot_id:b.lot_id,quantity:b.quantity,uom:b.uom,rate:b.rate,gst_rate:b.gst_rate};['item_master_id','lot_id','quantity','uom','rate','gst_rate'].forEach(k=>delete b[k]);body={...scopeBody(),...b,lines:[line]};delete body.business_date;delete body.shift_code}
  else body={...scopeBody(),...b};
  const r=await E.api('POST',F[tab].post,body);E.status(m,'Saved: '+Object.entries(r).filter(([k])=>!/_id$/.test(k)).map(([k,v])=>`${k.replaceAll('_',' ')} ${v}`).join(' · '),true);$('form').reset();list()}catch(e){E.status(m,e.message,false)}}
async function list(){const ent=$('ent').value;if(!ent)return;try{let html='';
  if(F[tab].list){const d=await E.api('GET',`/v90gx/plant/registers/${F[tab].list}?entity_id=${ent}`);html=d.rows.slice(0,50).map(x=>`<div class="list-item"><strong>${E.esc(x.business_date)} ${E.esc(x.shift_code||'')}</strong><small>${E.esc(F[tab].show(x))}</small></div>`).join('')}
  else if(tab==='complaint'){const d=await E.api('GET',`/v90gx/complaints?entity_id=${ent}`);html=d.complaints.map(x=>`<div class="list-item"><strong>${E.esc(x.complaint_no)} · ${E.esc(x.category)} · ${E.esc(x.severity)} · ${E.esc(x.status)}</strong><small>${E.esc(x.customer_name)} · ${E.esc(x.lot_code||'')} · ${E.esc(x.description)}</small>${x.status!=='CLOSED'?`<div class="row">${x.status==='OPEN'?`<button data-inv="${x.complaint_id}">Start investigation</button>`:''}<button data-cls="${x.complaint_id}">Close</button></div>`:`<small>Root cause: ${E.esc(x.root_cause)} · CAPA ${E.esc(x.capa_ref||'—')}</small>`}</div>`).join('')}
  else if(tab==='preturn'){const d=await E.api('GET',`/v90gx/purchase-returns?entity_id=${ent}`);html=d.returns.map(x=>`<div class="list-item"><strong>${E.esc(x.reason)} · ₹${E.esc(x.total_value)} · ${E.esc(x.status)}</strong><small>${E.esc(x.debit_note_no||'')} ${E.esc(x.created_at)}</small>${x.status==='DRAFT'?`<div class="row"><button data-post="${x.return_id}">Post (stock out + debit note)</button></div>`:''}</div>`).join('')}
  else if(tab==='summary'){const d=await E.api('GET',`/v90gx/plant/daily-summary?entity_id=${ent}&business_date=${$('bdate').value}`);html=`<div class="list-item"><strong>${E.esc(d.business_date)} · ${d.production_batches} batches</strong><small>Oil used ${d.oil.consumed_litres} L (topped up ${d.oil.topped_up_litres} L) · discard alerts ${d.oil.discard_required}</small><small>Fuel: ${d.fuel.map(x=>`${x.fuel_type} ${x.quantity} ${x.uom} ₹${x.amount}`).join(', ')||'—'}</small><small>Utilities: ${d.utilities.map(x=>`${x.utility_type} ${x.units} units ₹${x.amount}`).join(', ')||'—'}</small></div>`}
  $('list').innerHTML=html||'<div class="empty">No records yet.</div>'}catch(e){$('list').innerHTML=`<p class="error">${E.esc(e.message)}</p>`}}
document.addEventListener('click',async ev=>{const d=ev.target.dataset||{};try{
  if(d.tab){tab=d.tab;return panel()}
  if(d.inv){await E.api('POST',`/v90gx/complaints/${d.inv}/investigate`,{})}
  if(d.cls){const rc=prompt('Root cause');if(!rc)return;const a=prompt('Action taken');if(!a)return;const capa=prompt('CAPA reference (required for HIGH severity)','')||undefined;await E.api('POST',`/v90gx/complaints/${d.cls}/close`,{root_cause:rc,action_taken:a,capa_ref:capa})}
  if(d.post){const r=await E.api('POST',`/v90gx/purchase-returns/${d.post}/post`);alert(`Posted. Debit note ${r.debit_note_no||'(no prefix set)'} for ₹${r.debit_note_value}`)}
  if(d.inv||d.cls||d.post)list()}catch(e){alert(e.message)}});
function scopeSelects(){const o=$('org').value;E.fillSelect($('ent'),S.entities.filter(x=>!o||x.organization_id===o),'entity_id',x=>x.label);locs()}
function locs(){E.fillSelect($('loc'),S.locations.filter(l=>l.entity_id===$('ent').value),'location_id',l=>l.location_code+' — '+l.location_name)}
$('org').addEventListener('change',async()=>{scopeSelects();ITEMS=(await E.api('GET',`/v90gx/lookups/items?organization_id=${$('org').value}`)).items;panel()});
$('ent').addEventListener('change',()=>{locs();panel()});$('bdate').addEventListener('change',()=>{if(tab==='summary')list()});$('reload').addEventListener('click',list);
(async()=>{try{S=await E.scope();const orgs=[...new Set(S.entities.map(x=>x.organization_id).filter(Boolean))];E.fillSelect($('org'),orgs.map(o=>({o})),'o',x=>x.o);scopeSelects();if($('org').value)ITEMS=(await E.api('GET',`/v90gx/lookups/items?organization_id=${$('org').value}`)).items;panel()}catch(e){$('panel').innerHTML=`<p class="error">${E.esc(e.message)}</p>`}})();
</script></body></html>
