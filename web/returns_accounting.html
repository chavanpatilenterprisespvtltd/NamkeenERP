<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Namkeen ERP · Return Accounting</title><style>body{font-family:system-ui;margin:0;background:#f6f8fb;color:#1c2738}header{background:#16324f;color:white;padding:20px 28px}main{max-width:1200px;margin:22px auto;padding:0 16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.wrap{overflow:auto;background:white;border:1px solid #e1e7ef;border-radius:12px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eef1f5;text-align:left;white-space:nowrap;font-size:13px}input,button{padding:9px;border:1px solid #ccd5e1;border-radius:8px;background:white}</style></head><body><header><b>Namkeen ERP</b><div>Return Accounting · V90.bt</div></header><main><div class=toolbar><input id=org placeholder="Organization ID"><input id=entity placeholder="Entity ID"><input id=location placeholder="Location ID"><button onclick=load()>Refresh</button></div><h2>Credit Notes</h2><div class=wrap><table><thead><tr><th>Credit Note</th><th>Return</th><th>Customer</th><th>Status</th><th>Taxable</th><th>GST</th><th>Total</th><th>Created</th></tr></thead><tbody id=rows></tbody></table></div></main><script>const t=()=>localStorage.getItem('erp_access_token')||sessionStorage.getItem('erp_access_token')||'';const q=()=>`organization_id=${encodeURIComponent(org.value)}&entity_id=${encodeURIComponent(entity.value)}&location_id=${encodeURIComponent(location.value)}`;async function load(){let r=await fetch('/v90bt/accounting?'+q(),{headers:{Authorization:'Bearer '+t()}});let j=await r.json();rows.innerHTML=(j.items||[]).map(x=>`<tr><td>${x.credit_note_no}</td><td>${x.return_no}</td><td>${x.customer_id}</td><td>${x.status}</td><td>${x.taxable_value}</td><td>${x.gst_total}</td><td>${x.grand_total}</td><td>${x.created_at}</td></tr>`).join('')||'<tr><td colspan=8>No credit notes.</td></tr>'}</script></body></html>
