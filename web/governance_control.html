<!doctype html><html><head><meta charset="utf-8"><title>Governance Control</title><style>body{font-family:Arial,sans-serif;margin:24px;max-width:1200px}h1{margin-bottom:4px}.muted{color:#666}.card{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:7px;text-align:left;font-size:13px}button{padding:8px 12px}</style></head><body><h1>ERP Governance Control</h1><div class="muted">Audit trail · governed approvals · evidence readiness</div><div class="card"><label>Organization ID <input id="org" size="38"></label> <button onclick="load()">Load</button></div><div class="card"><h2>Governed Actions</h2><table><thead><tr><th>Action</th><th>Module</th><th>Subject</th><th>Status</th><th>Requested</th><th>Evidence</th></tr></thead><tbody id="actions"></tbody></table></div><div class="card"><h2>Audit Trail</h2><table><thead><tr><th>Time</th><th>Module</th><th>Action</th><th>Actor</th><th>Outcome</th><th>Subject</th></tr></thead><tbody id="audit"></tbody></table></div><script>async function j(u){const r=await fetch(u,{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}});return r.json()}async function load(){const o=document.getElementById('org').value;const a=await j('/v90fo/governance/actions?organization_id='+encodeURIComponent(o));document.getElementById('actions').innerHTML=(a.actions||[]).map(x=>`<tr><td>${x.action_code}</td><td>${x.module_name}</td><td>${x.subject_type}:${x.subject_id}</td><td>${x.status}</td><td>${x.requested_at}</td><td>${x.evidence_complete?'YES':'NO'}</td></tr>`).join('');const ev=await j('/v90fo/governance/audit?organization_id='+encodeURIComponent(o));document.getElementById('audit').innerHTML=(ev.events||[]).map(x=>`<tr><td>${x.created_at}</td><td>${x.module_name}</td><td>${x.action_code}</td><td>${x.actor_user_id}</td><td>${x.outcome}</td><td>${x.subject_type||''}:${x.subject_id||''}</td></tr>`).join('')}</script></body></html>
