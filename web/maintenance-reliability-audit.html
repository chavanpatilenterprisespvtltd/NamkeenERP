<!doctype html><html><head><meta charset="utf-8"><title>Reliability Audit & Compliance</title><style>body{font-family:system-ui;margin:32px;max-width:1100px}button,input{padding:8px;margin:4px}.card{border:1px solid #ddd;padding:16px;margin:12px 0;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h1>Reliability Audit & Compliance</h1><p>Evidence-backed audit view for CAPA, approvals, controlled standards and workflow-integrity exceptions.</p><div class="card"><label>Organization <input id="o"></label><label>Entity <input id="e"></label><label>Period <input id="p" value="2026-09"></label><button onclick="load()">Run Audit</button></div><div id="out"></div><script>async function load(){const o=document.getElementById('o').value,e=document.getElementById('e').value,p=document.getElementById('p').value;const t=localStorage.token||'';const h={'Authorization':'Bearer '+t};const r=await fetch(`/v90fd/maintenance/reliability-audit/dashboard?organization_id=${encodeURIComponent(o)}&entity_id=${encodeURIComponent(e)}&period_key=${encodeURIComponent(p)}`,{headers:h});const d=await r.json();document.getElementById('out').innerHTML='<pre>'+JSON.stringify(d,null,2)+'</pre>'}</script></body></html>
