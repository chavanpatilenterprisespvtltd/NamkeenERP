<!doctype html><html><head><meta charset="utf-8"><title>Workforce Planning</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:24px;background:#f6f7f9;color:#20242a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:10px;padding:16px}.v{font-size:26px;font-weight:700}.muted{color:#667085}</style></head><body><h1>Workforce Planning</h1><p class="muted">Roster, staffing gaps, attendance exceptions and labour-cost forecast.</p><div id="cards" class="grid"></div><script>const p=new URLSearchParams(location.search);const o=p.get('organization_id')||'';const e=p.get('entity_id')||'';async function load(){if(!o||!e)return;const r=await fetch(`/v90dq/workforce/dashboard?organization_id=${encodeURIComponent(o)}&entity_id=${encodeURIComponent(e)}`);const d=await r.json();document.getElementById('cards').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div class="muted">${k.replaceAll('_',' ')}</div><div class="v">${v}</div></div>`).join('')}load();</script></body></html>
