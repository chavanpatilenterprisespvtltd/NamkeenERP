<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales | Namkeen ERP</title><link rel="stylesheet" href="/web/assets/app.css"></head><body><main class="shell"><header><div><h1>Sales / Customer Orders</h1><span class="muted">Customer, order builder and sales-order workflow</span></div><a class="pill" href="/web">ERP Home</a></header><section class="card"><form id="f"><input id="o" placeholder="Organization ID" required><input id="e" placeholder="Entity ID" required><input id="l" placeholder="Location ID" required><button>Load Sales</button></form><p id="err" class="error"></p></section><section id="kpi" class="metric-grid"></section><section class="grid"><article><h2>Sales Orders</h2><div id="orders" class="list"></div></article><article><h2>Customers</h2><div id="customers" class="list"></div></article></section></main><script>const $=x=>document.getElementById(x),token=localStorage.getItem('erp_token')||sessionStorage.getItem('erp_token')||'';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));async function get(path,p){const r=await fetch(path+'?'+p,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Load failed');return d}$('f').addEventListener('submit',async ev=>{ev.preventDefault();$('err').textContent='';try{const p=new URLSearchParams({organization_id:$('o').value,entity_id:$('e').value,location_id:$('l').value});const [s,o,c]=await Promise.all([get('/v90bp/sales/summary',p),get('/v90bp/sales/orders',p),get('/v90bp/sales/customers',p)]);$('kpi').innerHTML=Object.entries(s.counts).map(([k,v])=>`<div class="card metric"><div class="metric-label">${esc(k.replaceAll('_',' '))}</div><div class="metric-value">${esc(v)}</div></div>`).join('');$('orders').innerHTML=o.items.map(x=>`<div class="list-item"><strong>${esc(x.order_no)} · ${esc(x.status)}</strong><small>Customer ${esc(x.customer_id)} · total ${esc(x.grand_total)}</small><small>Pricing ${esc(x.pricing_status)} · Credit ${esc(x.credit_status)} · Stock ${esc(x.stock_status)}</small></div>`).join('')||'<div class="empty">No sales orders.</div>';$('customers').innerHTML=c.items.map(x=>`<div class="list-item"><strong>${esc(x.name||x.display_name||x.code||x.customer_id)}</strong><small>${esc(x.phone||'')} ${esc(x.email||'')}</small></div>`).join('')||'<div class="empty">No customers.</div>'}catch(e){$('err').textContent=e.message}});</script></body></html>
