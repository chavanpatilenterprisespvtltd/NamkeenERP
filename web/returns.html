<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Namkeen ERP · Returns</title><style>body{font-family:system-ui;margin:0;background:#f6f8fb;color:#1c2738}header{background:#16324f;color:white;padding:20px 28px}main{max-width:1200px;margin:22px auto;padding:0 16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.card{background:white;border:1px solid #e1e7ef;border-radius:12px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:15px 0}.num{font-size:26px;font-weight:700}.wrap{overflow:auto;background:white;border:1px solid #e1e7ef;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eef1f5;text-align:left;white-space:nowrap;font-size:13px}input,select,button{padding:9px;border:1px solid #ccd5e1;border-radius:8px;background:white}</style></head><body><header><b>Namkeen ERP</b><div>Returns Operations · V90.bt</div></header><main><div class="toolbar"><input id="org" placeholder="Organization ID"><input id="entity" placeholder="Entity ID"><input id="location" placeholder="Location ID"><select id="status"><option value="">All</option><option>REQUESTED</option><option>RECEIVED_QC_HOLD</option><option>DISPOSITIONED</option></select><button onclick="load()">Refresh</button></div><div class="grid" id="kpi"></div><h2>Return Queue</h2><div class="wrap"><table><thead><tr><th>Return</th><th>Status</th><th>Sales Order</th><th>Customer</th><th>Reason</th><th>Requested</th></tr></thead><tbody id="rows"></tbody></table></div><h2>Disposition Activity</h2><div class="wrap"><table><thead><tr><th>Return</th><th>Disposition</th><th>Qty</th><th>Reason</th><th>Approved By</th><th>Date</th></tr></thead><tbody id="disp"></tbody></table></div></main><script>const t=()=>localStorage.getItem('erp_access_token')||sessionStorage.getItem('erp_access_token')||'';const q=()=>`organization_id=${encodeURIComponent(org.value)}&entity_id=${encodeURIComponent(entity.value)}&location_id=${encodeURIComponent(location.value)}`;async function get(u){let r=await fetch(u,{headers:{Authorization:'Bearer '+t()}});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){try{let s=await get('/v90bt/returns/summary?'+q());kpi.innerHTML=Object.entries(s.counts).map(([k,v])=>`<div class=card><div>${k.replaceAll('_',' ')}</div><div class=num>${Number(v).toLocaleString()}</div></div>`).join('');let st=status.value;let r=await get('/v90bt/returns?'+q()+(st?'&status='+st:''));rows.innerHTML=r.items.map(x=>`<tr><td>${x.return_no}</td><td>${x.status}</td><td>${x.sales_order_id}</td><td>${x.customer_id}</td><td>${x.reason||''}</td><td>${x.requested_at}</td></tr>`).join('')||'<tr><td colspan=6>No returns.</td></tr>';let d=await get('/v90bt/dispositions?'+q());disp.innerHTML=d.items.map(x=>`<tr><td>${x.return_no}</td><td>${x.disposition}</td><td>${x.quantity}</td><td>${x.reason||''}</td><td>${x.approved_by}</td><td>${x.created_at}</td></tr>`).join('')||'<tr><td colspan=6>No disposition activity.</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan=6>'+e.message+'</td></tr>'}}</script></body></html>
