<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRN | Namkeen ERP</title><link rel="stylesheet" href="/web/assets/app.css"></head><body><main class="shell"><header><div><h1>GRN Receiving</h1><span class="muted">Goods receipt and incoming QC queue</span></div><a class="pill" href="/web">ERP Home</a></header><section class="card"><div class="toolbar"><div><strong>Scope</strong><p class="muted">Enter organization, entity and location UUIDs to load the operational queue.</p></div></div><form id="f"><input id="o" placeholder="Organization ID" required><input id="e" placeholder="Entity ID" required><input id="l" placeholder="Location ID" required><button>Load GRN</button></form><p id="err" class="error"></p></section><section id="content" class="grid"></section></main><script>
let token=sessionStorage.getItem('erp_token')||'';const $=x=>document.getElementById(x);function h(){return {'Authorization':`Bearer ${token}`}}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('f').addEventListener('submit',async ev=>{ev.preventDefault();$('err').textContent='';try{const p=new URLSearchParams({organization_id:$('o').value,entity_id:$('e').value,location_id:$('l').value});const [s,g]=await Promise.all([fetch('/v90bn/inventory/summary?'+p,{headers:h()}),fetch('/v90bn/grn?'+p,{headers:h()})]);const sd=await s.json(),gd=await g.json();if(!s.ok||!g.ok)throw Error(sd.detail||gd.detail||'Load failed');$('content').innerHTML=`<article><h2>Receiving KPIs</h2><div class="metric-grid">${Object.entries(sd.counts).map(([k,v])=>`<div class="card metric"><div class="metric-label">${esc(k.replaceAll('_',' '))}</div><div class="metric-value">${v}</div></div>`).join('')}</div></article><article><h2>Recent GRNs</h2><div class="list">${gd.items.map(x=>`<div class="list-item"><strong>${esc(x.grn_no)}</strong><small>Status: ${esc(x.status)} · Supplier: ${esc(x.supplier_id)}</small><small>Received: ${esc(x.received_at||'')}</small></div>`).join('')||'<div class="empty">No GRNs found.</div>'}</div></article>`}catch(e){$('err').textContent=e.message}});
</script></body></html>
