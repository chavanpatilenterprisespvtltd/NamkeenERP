<!doctype html><html><head><meta charset="utf-8"><title>Reliability CAPA</title><style>body{font-family:Arial;margin:24px}button{padding:9px;margin:4px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body><h1>Reliability CAPA</h1><p>Recurring reliability failures and benchmark exceptions are converted into controlled CAPA records. Operational maintenance changes are never applied automatically.</p><button onclick="loadDash()">Refresh dashboard</button><button onclick="generate()">Generate CAPA</button><pre id="out"></pre><script>const out=document.getElementById('out');const h={'Content-Type':'application/json'};async function generate(){let o=prompt('Organization ID');let p=prompt('Period YYYY-MM');if(!o||!p)return;let r=await fetch('/v90fc/maintenance/reliability-capa/generate',{method:'POST',headers:h,body:JSON.stringify({organization_id:o,period_key:p})});out.textContent=await r.text()}async function loadDash(){let o=prompt('Organization ID');let p=prompt('Period YYYY-MM');if(!o||!p)return;let r=await fetch(`/v90fc/maintenance/reliability-capa/dashboard?organization_id=${encodeURIComponent(o)}&period_key=${encodeURIComponent(p)}`);out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
