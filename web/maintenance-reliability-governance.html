<!doctype html><html><head><meta charset="utf-8"><title>Reliability Executive Governance</title><style>body{font-family:system-ui;margin:2rem}button{padding:.6rem 1rem}table{border-collapse:collapse;width:100%}td,th{padding:.5rem;border:1px solid #ddd;text-align:left}</style></head><body><h1>Reliability Executive Governance</h1><p>Escalation, evidence and period-control view. Advisory/control-only; no automatic maintenance mutation.</p><label>Organization <input id="o"></label> <label>Period <input id="p" placeholder="YYYY-MM"></label> <button onclick="load()">Load</button><div id="out"></div><script>async function load(){const o=document.getElementById('o').value,p=document.getElementById('p').value;const r=await fetch(`/v90fh/maintenance/reliability-governance/dashboard?organization_id=${encodeURIComponent(o)}&period_key=${encodeURIComponent(p)}`);const x=await r.json();document.getElementById('out').innerHTML='<h2>Entity governance</h2>'+((x.rows||[]).map(a=>`<p><b>${a.entity_id}</b>: ${a.governance_score} — ${a.assessment}; open ${a.open_action_count}, overdue ${a.overdue_action_count}</p>`).join('')||'<p>No snapshots.</p>')+'<h2>Open escalations</h2>'+((x.open_escalations||[]).map(a=>`<p>${a.escalation_level}: ${a.reason} (${a.status})</p>`).join('')||'<p>None.</p>')}</script></body></html>
