<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salesperson | Namkeen ERP</title><link rel="stylesheet" href="/web/assets/app.css"></head><body><main class="shell"><header><div><h1>Salesperson Home</h1><span class="muted">Customers, visits and order-builder workspace</span></div><a class="pill" href="/web">ERP Home</a></header><section class="card"><form id="f"><input id="o" placeholder="Organization ID" required><input id="e" placeholder="Entity ID" required><input id="l" placeholder="Location ID" required><button>Load Workspace</button></form><p id="err" class="error"></p></section><section id="kpi" class="metric-grid"></section><section class="grid"><article><h2>Customers</h2><input id="q" placeholder="Search customer"><div id="customers" class="list"></div></article><article><h2>Recent Visits</h2><div id="visits" class="list"></div></article></section></main><script>const $=x=>document.getElementById(x),token=localStorage.getItem('erp_token')||sessionStorage.getItem('erp_token')||'';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));let base='';async function get(path,p){const r=await fetch(path+'?'+p,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Load failed');return d}async function load(){const p=new URLSearchParams({organization_id:$('o').value,entity_id:$('e').value,location_id:$('l').value});const s=await get('/v90bq/salesperson/summary',p);const [c,v]=await Promise.all([get('/v90bq/salesperson/customers',p),get('/v90bq/salesperson/visits',p)]);$('kpi').innerHTML=Object.entries(s.counts).map(([k,x])=>`<div class="card metric"><div class="metric-label">${esc(k.replaceAll('_',' '))}</div><div class="metric-value">${esc(x)}</div></div>`).join('');render(c.items,v.items)}function render(c,v){$('customers').innerHTML=c.map(x=>`<div class="list-item"><strong>${esc(x.name||x.display_name||x.code)}</strong><small>${esc(x.phone||'')} ${esc(x.email||'')}</small></div>`).join('')||'<div class="empty">No customers.</div>';$('visits').innerHTML=v.map(x=>`<div class="list-item"><strong>${esc(x.visit_at)}</strong><small>${esc(x.customer_id)} · ${esc(x.purpose)}</small><small>${esc(x.next_action||'')}</small></div>`).join('')||'<div class="empty">No visits.</div>'}$('f').addEventListener('submit',async e=>{e.preventDefault();$('err').textContent='';try{await load()}catch(x){$('err').textContent=x.message}});$('q').addEventListener('input',async()=>{if(!$('o').value)return;try{const p=new URLSearchParams({organization_id:$('o').value,entity_id:$('e').value,location_id:$('l').value,q:$('q').value});const c=await get('/v90bq/salesperson/customers',p);$('customers').innerHTML=c.items.map(x=>`<div class="list-item"><strong>${esc(x.name||x.display_name||x.code)}</strong><small>${esc(x.phone||'')} ${esc(x.email||'')}</small></div>`).join('')||'<div class="empty">No customers.</div>'}catch(x){}});</script></body></html>
