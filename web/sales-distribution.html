<!doctype html><html><head><meta charset="utf-8"><title>Advanced Sales & Distribution</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:24px;max-width:1200px}button,input{padding:9px;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{border:1px solid #ddd;border-radius:10px;padding:14px}.muted{color:#666}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>Advanced Sales & Distribution</h1><p class="muted">Performance cockpit for sales, customers, territories, channels and management actions.</p><div><input id="org" placeholder="Organization ID"><input id="entity" placeholder="Entity ID"><input id="loc" placeholder="Location ID (optional)"><input id="from" type="date"><input id="to" type="date"><button onclick="load()">Load</button></div><div id="cards" class="grid"></div><h2>Dimensions</h2><table><thead><tr><th>Type</th><th>Name</th><th>Sales</th><th>Orders</th><th>Customers</th><th>Productivity</th></tr></thead><tbody id="rows"></tbody></table><script>async function load(){const p=new URLSearchParams({organization_id:org.value,entity_id:entity.value});if(loc.value)p.set('location_id',loc.value);if(from.value)p.set('from_date',from.value);if(to.value)p.set('to_date',to.value);const r=await fetch('/v90gn/sales-distribution?'+p);const d=await r.json();if(!r.ok){alert(d.detail||'Unable to load');return}cards.innerHTML=['net_sales','invoice_count','order_count','customer_count','dispatched_qty','return_value','collection_value','return_rate_pct','collection_realization_pct','avg_order_value'].map(k=>`<div class="card"><b>${k.replaceAll('_',' ')}</b><div>${d[k]??0}</div></div>`).join('');rows.innerHTML=d.dimensions.map(x=>`<tr><td>${x.dimension_type}</td><td>${x.dimension_name||x.dimension_key}</td><td>${x.sales_value}</td><td>${x.order_count}</td><td>${x.customer_count}</td><td>${x.productivity_score}</td></tr>`).join('')}</script></body></html>
