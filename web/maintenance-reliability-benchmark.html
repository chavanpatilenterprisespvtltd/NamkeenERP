<!doctype html><html><head><meta charset="utf-8"><title>Enterprise Reliability Benchmarking</title><style>body{font-family:system-ui;margin:32px;max-width:1100px}input,button{padding:9px;margin:4px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{border:1px solid #ddd;padding:8px}th{background:#f4f4f4}.note{padding:12px;background:#f7f7f7}</style></head><body><h1>Enterprise Reliability Benchmarking</h1><p class="note">Advisory internal benchmarking across comparable entities and work centers. Scores are normalized, transparent and observational; no operational maintenance change is applied automatically.</p><label>Organization <input id="o"></label><label>Period <input id="p" value="2026-09"></label><button onclick="run()">Load Ranking</button><div id="out"></div><script>async function run(){const o=document.getElementById('o').value,p=document.getElementById('p').value;const r=await fetch(`/v90fb/maintenance/reliability-benchmark/dashboard?organization_id=${encodeURIComponent(o)}&period_key=${p}`);const d=await r.json();let h=`<p>Benchmarks: ${d.benchmark_count} | Best score: ${d.best_score} | Open exceptions: ${d.open_exception_count}</p><table><tr><th>Scope</th><th>Entity</th><th>Rank</th><th>Score</th><th>Gap</th><th>Assessment</th><th>Adoption %</th></tr>`;for(const x of d.rows)h+=`<tr><td>${x.scope_type}</td><td>${x.scope_name||x.scope_id}</td><td>${x.benchmark_rank}/${x.peer_count}</td><td>${x.benchmark_score}</td><td>${x.benchmark_gap}</td><td>${x.assessment}</td><td>${x.adoption_pct}</td></tr>`;document.getElementById('out').innerHTML=h+'</table>'}</script></body></html>
