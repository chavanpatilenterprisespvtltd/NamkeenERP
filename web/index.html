<!-- FILE PATH: web/index.html -->
<!-- ERP Home v1.1 (Session CS2 — adds the "Daily work" links to the new V90.gx entry screens; nothing else changed) -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Namkeen ERP</title><link rel="stylesheet" href="/web/assets/app.css"></head>
<body><main class="shell"><header><div><h1>Namkeen ERP</h1><span id="release">Loading…</span></div><span id="role" class="pill">Signed out</span></header>
<section class="card" id="login-card"><h2>ERP Sign in</h2><form id="login"><input id="username" placeholder="Username" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in</button></form><p id="login-error" class="error"></p></section>
<section class="grid hidden" id="workspace"><article><h2>Role Dashboard</h2><div id="widgets" class="chips"></div></article><article><h2>Available Screens</h2><div id="screens" class="chips"></div></article><article><h2>Daily work</h2><div class="chips"><a class="chip" href="/ui/daily-work">Daily work (all entry screens)</a><a class="chip" href="/ui/company-profile">Company X / Y profile</a><a class="chip" href="/ui/intercompany-xy">X → Y transfers</a><a class="chip" href="/ui/plant-registers">Plant registers</a></div></article><article><h2>Operational UI</h2><div class="chips"><a class="chip" href="/ui/grn">GRN Receiving</a><a class="chip" href="/ui/qc">Incoming QC</a><a class="chip" href="/ui/inventory">Inventory</a><a class="chip" href="/ui/products">Products</a><a class="chip" href="/ui/recipes">Recipes</a><a class="chip" href="/ui/procurement">Procurement</a></div></article><article><h2>System Health</h2><pre id="health">Loading…</pre></article><article><h2>Build</h2><pre id="build">Loading…</pre></article></section></main>
<script>
let token='';
const $=id=>document.getElementById(id);
function authHeaders(){return {'Authorization':`Bearer ${token}`,'Content-Type':'application/json'}}
async function refresh(){const [h,b,s,d]=await Promise.all([fetch('/health'),fetch('/build'),fetch('/v90bk/screens',{headers:authHeaders()}),fetch('/v90bk/dashboard',{headers:authHeaders()})]); const hv=await h.json(),bv=await b.json(),sv=await s.json(),dv=await d.json(); $('release').textContent=hv.version||''; $('role').textContent=sv.role||''; $('health').textContent=JSON.stringify(hv,null,2); $('build').textContent=JSON.stringify(bv,null,2); $('screens').innerHTML=sv.screens.map(x=>`<span class="chip">${x.title}</span>`).join(''); $('widgets').innerHTML=dv.widgets.map(x=>`<span class="chip">${x}</span>`).join(''); $('login-card').classList.add('hidden'); $('workspace').classList.remove('hidden');}
$('login').addEventListener('submit',async e=>{e.preventDefault();$('login-error').textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Sign-in failed');token=data.access_token;sessionStorage.setItem('erp_token',token);await refresh()}catch(err){$('login-error').textContent=err.message}});
const saved=sessionStorage.getItem('erp_token'); if(saved){token=saved;refresh().catch(()=>{sessionStorage.removeItem('erp_token');token=''})} else {Promise.all([fetch('/health'),fetch('/build')]).then(async ([h,b])=>{$('health').textContent=JSON.stringify(await h.json(),null,2);$('build').textContent=JSON.stringify(await b.json(),null,2)});}
</script></body></html>
