<!doctype html><html><head><meta charset="utf-8"><title>Governance Coverage Remediation</title><style>body{font-family:system-ui;margin:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}.metric{display:inline-block;padding:14px;margin:5px;border:1px solid #ddd;border-radius:8px}</style></head><body><h1>ERP Governance Coverage Remediation</h1><button onclick="scan()">Scan Critical Actions</button><div id="metrics"></div><table><thead><tr><th>Module</th><th>Action</th><th>Gap</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><script>const h=()=>({'Authorization':'Bearer '+(localStorage.getItem('access_token')||'')});async function scan(){let r=await fetch('/v90fr/governance/coverage/scan',{method:'POST',headers:h()});let d=await r.json();document.getElementById('metrics').innerHTML=`<div class="metric">Coverage: ${d.coverage_percent}%</div><div class="metric">Open gaps: ${d.open_gaps}</div>`;document.getElementById('rows').innerHTML=d.gaps.map(x=>`<tr><td>${x.module_name}</td><td>${x.action_code}</td><td>${x.gap_type}</td><td>OPEN</td></tr>`).join('')}</script></body></html>
