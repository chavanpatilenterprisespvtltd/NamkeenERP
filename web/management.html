<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Namkeen ERP Management</title><link rel="stylesheet" href="/web/assets/app.css"></head><body><main class="shell"><header><div><h1>Namkeen ERP</h1><span id="release" class="muted">Management Console</span></div><div><span id="role" class="pill">—</span><button id="logout" class="ghost">Sign out</button></div></header><nav class="tabs"><button data-tab="dashboard">Management</button><button data-tab="approvals">Approval Inbox <span id="approval-badge"></span></button><button data-tab="notifications">Notifications <span id="notification-badge"></span></button></nav><section id="dashboard" class="panel"><div class="toolbar"><h2>Management Dashboard</h2><button id="refresh">Refresh</button></div><div id="metrics" class="metric-grid"></div><div class="card"><h3>Operational Snapshot</h3><pre id="summary"></pre></div></section><section id="approvals" class="panel hidden"><div class="toolbar"><h2>Approval Inbox</h2><button data-refresh="approvals">Refresh</button></div><div id="approval-list" class="list"></div></section><section id="notifications" class="panel hidden"><div class="toolbar"><h2>Notifications Center</h2><button data-refresh="notifications">Refresh</button></div><div id="notification-list" class="list"></div></section><p id="error" class="error"></p></main><script>
let token=sessionStorage.getItem('erp_token')||'';const $=id=>document.getElementById(id);function headers(){return {Authorization:`Bearer ${token}`}};async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...headers(),...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
function show(tab){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('hidden',x.id!==tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));history.replaceState({},'',`/ui/${tab==='dashboard'?'management':tab}`)}
async function loadSummary(){const d=await api('/v90bl/management-summary');$('release').textContent=d.release;$('role').textContent=d.role;const names={sales_orders:'Sales Orders',open_sales_orders:'Open Orders',pending_dispatch:'Pending Dispatch',production_batches:'Production Batches',inventory_lots:'Inventory Lots',pending_approvals:'Pending Approvals',pending_notifications:'Pending Notifications',open_returns:'Open Returns'};$('metrics').innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="metric card"><div class="metric-label">${names[k]||k}</div><div class="metric-value">${v}</div></div>`).join('');$('summary').textContent=JSON.stringify(d,null,2);$('approval-badge').textContent=d.metrics.pending_approvals; $('notification-badge').textContent=d.metrics.pending_notifications}
async function loadApprovals(){const d=await api('/v90bl/approval-inbox');$('approval-list').innerHTML=d.approvals.length?d.approvals.map(x=>`<article class="list-item"><strong>${x.workflow_name}</strong><span>${x.subject_type} · ${x.subject_id}</span><small>${x.status} · ${x.requested_at||''}</small></article>`).join(''):'<div class="empty">No pending approvals.</div>'}
async function loadNotifications(){const d=await api('/v90bl/notification-center');$('notification-list').innerHTML=d.notifications.length?d.notifications.map(x=>`<article class="list-item ${x.is_read?'read':''}"><strong>${x.subject||'Notification'}</strong><span>${x.body}</span><small>${x.channel} · ${x.created_at||''} ${x.is_read?'':'· UNREAD'}</small>${x.is_read?'':`<button data-read="${x.notification_id}">Mark read</button>`}</article>`).join(''):'<div class="empty">No notifications.</div>'}
async function refreshAll(){try{await Promise.all([loadSummary(),loadApprovals(),loadNotifications()]);$('error').textContent=''}catch(e){$('error').textContent=e.message}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('refresh').onclick=refreshAll;document.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=()=>b.dataset.refresh==='approvals'?loadApprovals():loadNotifications());$('logout').onclick=()=>{sessionStorage.removeItem('erp_token');location.href='/web'};document.addEventListener('click',async e=>{if(e.target.dataset.read){await api(`/v90bl/notifications/${e.target.dataset.read}/read`,{method:'POST'});loadNotifications()}});if(!token)location.href='/web';else refreshAll();
</script></body></html>
