<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe / BOM</title><style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#18212f}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}nav a{margin-right:14px}</style></head><body><div class="wrap"><nav><a href="/ui/management">Management</a><a href="/ui/products">Products</a><a href="/ui/recipes">Recipes</a><a href="/ui/procurement">Procurement</a></nav><h1>Recipe / BOM</h1><div class="card"><p><input id="o" placeholder="Organization UUID" size="38"> <input id="e" placeholder="Entity UUID" size="38"> <button onclick="load()">Load</button></p></div><div id="out" class="card"></div></div><script>async function load(){let r=await fetch('/v90bm/recipes?organization_id='+encodeURIComponent(o.value)+'&entity_id='+encodeURIComponent(e.value),{headers:{Authorization:'Bearer '+(localStorage.getItem('erp_token')||'')}});let j=await r.json();out.innerHTML='<table><tr><th>Code</th><th>Name</th><th>Version</th><th>Status</th><th>Yield</th><th>Loss %</th></tr>'+j.recipes.map(x=>'<tr><td>'+x.recipe_code+'</td><td>'+x.recipe_name+'</td><td>'+x.version_no+'</td><td>'+x.status+'</td><td>'+x.yield_qty+' '+x.yield_uom+'</td><td>'+x.expected_loss_pct+'</td></tr>').join('')+'</table>'}</script></body></html>
