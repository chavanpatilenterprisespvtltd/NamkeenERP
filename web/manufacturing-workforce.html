<!doctype html><html><head><meta charset="utf-8"><title>Manufacturing & Workforce Integration</title><style>body{font-family:system-ui;margin:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{padding:14px;border:1px solid #ddd;border-radius:8px;min-width:150px}</style></head><body><h1>Manufacturing & Workforce Integration</h1><p>Production execution and labour capture alignment.</p><div id="cards" class="cards"></div><h2>Integration controls</h2><table><tbody id="t"></tbody></table><script>const q=new URLSearchParams(location.search); const api='/v90gp/manufacturing-workforce?'+q.toString(); fetch(api).then(r=>r.json()).then(d=>{const labels={batch_count:'Batches',completed_batch_count:'Completed Batches',planned_qty:'Planned Qty',captured_output_qty:'Captured Output',labour_hours:'Labour Hours',productive_hours:'Productive Hours',downtime_hours:'Downtime Hours',overtime_hours:'Overtime Hours',labour_cost:'Labour Cost',output_per_hour:'Output / Hour',labour_cost_per_unit:'Labour Cost / Unit',workforce_coverage_pct:'Workforce Coverage %',productivity_index:'Productivity Index'};document.getElementById('cards').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="card"><b>${v}</b><div>${d[k]??0}</div></div>`).join('');document.getElementById('t').innerHTML='<tr><th>Metric</th><th>Value</th></tr>'+Object.entries(labels).map(([k,v])=>`<tr><td>${v}</td><td>${d[k]??0}</td></tr>`).join('')}).catch(e=>document.body.insertAdjacentHTML('beforeend','<p>Unable to load dashboard.</p>'));</script></body></html>
