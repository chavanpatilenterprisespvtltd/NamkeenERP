<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QC | Namkeen ERP</title><link rel="stylesheet" href="/web/assets/app.css"></head><body><main class="shell"><header><div><h1>Incoming QC</h1><span class="muted">GRN inspection and disposition queue</span></div><a class="pill" href="/web">ERP Home</a></header><section class="card"><form id="f"><input id="o" placeholder="Organization ID" required><input id="e" placeholder="Entity ID" required><input id="l" placeholder="Location ID" required><select id="s"><option value="">All statuses</option><option>PENDING</option><option>PASS</option><option>PARTIAL</option><option>REJECT</option></select><button>Load QC</button></form><p id="err" class="error"></p></section><section class="card"><div id="rows" class="list"></div></section></main><script>
let token=sessionStorage.getItem('erp_token')||'';const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c))}
$('f').addEventListener('submit',async ev=>{ev.preventDefault();$('err').textContent='';try{const p=new URLSearchParams({organization_id:$('o').value,entity_id:$('e').value,location_id:$('l').value});if($('s').value)p.set('status',$('s').value);const r=await fetch('/v90bn/qc?'+p,{headers:{Authorization:`Bearer ${token}`}}),d=await r.json();if(!r.ok)throw Error(d.detail||'Load failed');$('rows').innerHTML=d.items.map(x=>`<div class="list-item"><strong>${esc(x.inspection_no)} · ${esc(x.status)}</strong><small>GRN ${esc(x.grn_no)} · Line ${esc(x.line_no)} · Item ${esc(x.item_master_id)}</small><small>Tested ${esc(x.tested_qty)} · Accepted ${esc(x.accepted_qty)} · Rejected ${esc(x.rejected_qty)}</small><small>${esc(x.reason||x.remarks||'')}</small></div>`).join('')||'<div class="empty">No inspections found.</div>'}catch(e){$('err').textContent=e.message}})
</script></body></html>
