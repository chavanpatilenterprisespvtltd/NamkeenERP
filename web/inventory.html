<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory | Namkeen ERP</title><link rel="stylesheet" href="/web/assets/app.css"></head><body><main class="shell"><header><div><h1>Inventory Operations</h1><span class="muted">Lots, balances, ledger movements and transfers</span></div><a class="pill" href="/web">ERP Home</a></header><section class="card"><form id="f"><input id="o" placeholder="Organization ID" required><input id="e" placeholder="Entity ID" required><input id="l" placeholder="Location ID" required><button>Load Inventory</button></form><p id="err" class="error"></p></section><section id="kpi" class="metric-grid"></section><section class="grid"><article><h2>Lots</h2><div id="lots" class="list"></div></article><article><h2>Stock Ledger</h2><div id="ledger" class="list"></div></article><article><h2>Transfers</h2><div id="transfers" class="list"></div></article></section></main><script>
let token=sessionStorage.getItem('erp_token')||'';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));async function get(path,p){const r=await fetch(path+'?'+p,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Load failed');return d}
$('f').addEventListener('submit',async ev=>{ev.preventDefault();$('err').textContent='';try{const p=new URLSearchParams({organization_id:$('o').value,entity_id:$('e').value,location_id:$('l').value});const [s,l,g,t]=await Promise.all([get('/v90bn/inventory/summary',p),get('/v90bn/lots',p),get('/v90bn/ledger',p),get('/v90bn/transfers',p)]);$('kpi').innerHTML=Object.entries(s.counts).map(([k,v])=>`<div class="card metric"><div class="metric-label">${esc(k.replaceAll('_',' '))}</div><div class="metric-value">${v}</div></div>`).join('');$('lots').innerHTML=l.items.map(x=>`<div class="list-item"><strong>${esc(x.lot_code)}</strong><small>Item ${esc(x.item_master_id)} · ${esc(x.status)} · QC ${esc(x.qc_status)}</small><small>Available ${esc(x.available_qty)} ${esc(x.uom)} · Expiry ${esc(x.expiry_date||'')}</small></div>`).join('')||'<div class="empty">No lots found.</div>';$('ledger').innerHTML=g.items.slice(0,50).map(x=>`<div class="list-item"><strong>${esc(x.movement_type)} · ${esc(x.quantity)} ${esc(x.uom)}</strong><small>Item ${esc(x.item_master_id)} · Ref ${esc(x.reference_type)}/${esc(x.reference_id)}</small><small>${esc(x.created_at||'')}</small></div>`).join('')||'<div class="empty">No movements found.</div>';$('transfers').innerHTML=t.items.map(x=>`<div class="list-item"><strong>${esc(x.status)} · ${esc(x.transfer_id)}</strong><small>From ${esc(x.from_warehouse_id)} → ${esc(x.to_warehouse_id)}</small><small>${esc(x.created_at||'')}</small></div>`).join('')||'<div class="empty">No transfers found.</div>'}catch(e){$('err').textContent=e.message}})
</script></body></html>
