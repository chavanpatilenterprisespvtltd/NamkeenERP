<!doctype html><html><head><meta charset="utf-8"><title>Maintenance Execution Feedback</title><style>body{font-family:system-ui;margin:24px;max-width:1100px}input,button{padding:8px;margin:4px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h1>Maintenance Execution Feedback</h1><p>Closed-loop view of queue priority/risk predictions versus observed maintenance intervention and subsequent breakdown outcomes.</p><label>Organization <input id=o></label><label>Entity <input id=e></label><label>Period <input id=p value="2026-09"></label><button onclick=load()>Load</button><pre id=summary></pre><table><thead><tr><th>Work Center</th><th>Priority</th><th>Risk</th><th>Response h</th><th>SLA %</th><th>Post-intervention breakdowns</th><th>Risk hits</th><th>False+</th><th>Missed</th><th>Repeat</th><th>Calibration error</th></tr></thead><tbody id=rows></tbody></table><script>async function load(){let q=new URLSearchParams({organization_id:o.value,entity_id:e.value,period_key:p.value});let r=await fetch('/v90er/maintenance/execution-feedback/dashboard?'+q,{credentials:'same-origin'});let d=await r.json();summary.textContent=JSON.stringify({count:d.count,avg_response_hours:d.avg_response_hours,sla_compliance_pct:d.sla_compliance_pct,risk_hits:d.risk_hits,false_positives:d.false_positives,missed_risks:d.missed_risks,repeat_failures:d.repeat_failures},null,2);rows.innerHTML=(d.rows||[]).map(x=>`<tr><td>${x.work_center_id||''}</td><td>${x.priority_level}</td><td>${x.risk_level}</td><td>${x.response_hours}</td><td>${x.sla_compliance_pct}</td><td>${x.breakdowns_after_intervention}</td><td>${x.risk_hits}</td><td>${x.false_positives}</td><td>${x.missed_risks}</td><td>${x.repeat_failures}</td><td>${x.risk_calibration_error}</td></tr>`).join('')}</script></body></html>
