<!doctype html><html><head><meta charset="utf-8"><title>Maintenance ROI</title><style>body{font-family:system-ui;margin:24px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}.muted{color:#666}</style></head><body><h1>Maintenance ROI & Reliability Optimization</h1><p class="muted">Preventive maintenance ROI, avoided breakdown cost, reliability benefit and OEE impact.</p><div id="summary">Load a period using the API.</div><script>async function load(){const p=new URLSearchParams(location.search);if(!p.get('organization_id'))return;const u='/v90em/maintenance/roi/dashboard?'+p.toString();const r=await fetch(u,{credentials:'same-origin'});const j=await r.json();document.getElementById('summary').innerHTML='<h2>Optimization score: '+j.average_optimization_score+'</h2><table><tr><th>Work centre</th><th>Preventive cost</th><th>Avoided breakdown</th><th>Net benefit</th><th>ROI %</th><th>OEE improvement %</th><th>Score</th><th>Status</th></tr>'+j.rows.map(x=>'<tr><td>'+ (x.work_center_id||'All')+'</td><td>'+x.current_preventive_cost+'</td><td>'+x.avoided_breakdown_cost+'</td><td>'+x.net_reliability_benefit+'</td><td>'+x.preventive_roi_pct+'</td><td>'+x.oee_improvement_pct+'</td><td>'+x.optimization_score+'</td><td>'+x.status+'</td></tr>').join('')+'</table>'}load();</script></body></html>
