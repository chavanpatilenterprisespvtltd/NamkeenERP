<!doctype html><html><head><meta charset="utf-8"><title>Reliability Executive Command Center</title><style>body{font-family:system-ui;margin:24px;max-width:1200px}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.card{display:inline-block;padding:14px;margin:4px;border:1px solid #ddd;border-radius:8px}.risk{font-weight:700}</style></head><body><h1>Reliability Executive Command Center</h1><p>Consolidated view of reliability, maintenance cost, OEE/downtime, effectiveness, standards, CAPA, benchmarking and audit compliance.</p><div id="summary"></div><table><thead><tr><th>Entity</th><th>Health</th><th>Assessment</th><th>OEE %</th><th>Downtime h</th><th>Maintenance cost</th><th>Audit</th><th>CAPA open</th><th>Benchmark exceptions</th></tr></thead><tbody id="rows"></tbody></table><script>const p=new URLSearchParams(location.search); const org=p.get('organization_id')||''; const period=p.get('period_key')||''; fetch(`/v90fe/maintenance/reliability-command/dashboard?organization_id=${encodeURIComponent(org)}&period_key=${encodeURIComponent(period)}`).then(r=>r.json()).then(x=>{document.getElementById('summary').innerHTML=`<div class="card"><b>Entities</b><br>${x.entity_count}</div><div class="card"><b>Avg health</b><br>${x.average_health_score}</div><div class="card"><b>Open exceptions</b><br>${x.open_exceptions.length}</div>`; document.getElementById('rows').innerHTML=x.rows.map(r=>`<tr><td>${r.entity_id}</td><td class="risk">${r.executive_health_score}</td><td>${r.assessment}</td><td>${r.oee_pct}</td><td>${r.breakdown_hours}</td><td>${r.maintenance_cost}</td><td>${r.audit_compliance_score}</td><td>${r.capa_open_count}</td><td>${r.benchmark_exception_count}</td></tr>`).join('')})</script></body></html>
