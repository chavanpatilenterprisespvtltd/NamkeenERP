<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workforce Budget & Benchmarking</title><style>body{font-family:system-ui;max-width:1150px;margin:32px auto;padding:0 18px}section{border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{padding:14px;background:#f6f6f6;border-radius:8px}.api{font-family:ui-monospace,monospace;font-size:13px}</style></head><body><h1>Workforce Budget & Benchmarking</h1><p>Compare labour budget vs actual, overtime, cost variance and efficiency.</p><section><h2>Dashboard</h2><div id="dash" class="grid"><div class="card">Pass <code>organization_id</code> and <code>entity_id</code> in the URL.</div></div></section><section><h2>APIs</h2><div class="api">POST /v90dv/workforce/budgets<br>POST /v90dv/workforce/actuals<br>POST /v90dv/workforce/snapshots<br>GET /v90dv/workforce/dashboard</div></section><script>const p=new URLSearchParams(location.search),o=p.get('organization_id'),e=p.get('entity_id'),pid=p.get('period_id');if(o&&e)fetch(`/v90dv/workforce/dashboard?organization_id=${encodeURIComponent(o)}&entity_id=${encodeURIComponent(e)}${pid?'&period_id='+encodeURIComponent(pid):''}`).then(r=>r.json()).then(x=>dash.innerHTML=Object.entries(x).map(([k,v])=>`<div class="card"><b>${k}</b><br>${v}</div>`).join('')).catch(()=>dash.innerHTML='<div class="card">Dashboard unavailable</div>');</script></body></html>
