<!doctype html><html><head><meta charset="utf-8"><title>Customer & Distribution Execution</title><style>body{font-family:system-ui;margin:32px;max-width:1100px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:10px;padding:16px}.n{font-size:26px;font-weight:700}</style></head><body><h1>Customer & Distribution Execution</h1><p>Route/beat execution, customer health and service exceptions.</p><div id="cards" class="grid"></div><h2>Customer health</h2><div id="health">Use the API endpoint <code>/v90go/customer-execution/health</code> with your authenticated scope.</div><script>const labels=['planned_stops','completed_stops','completion_pct','planned_beats','customers_visited','active_customers','at_risk_customers','churned_customers','open_service_exceptions'];document.getElementById('cards').innerHTML=labels.map(x=>`<div class="card"><div>${x.replaceAll('_',' ')}</div><div class="n">—</div></div>`).join('');</script></body></html>
