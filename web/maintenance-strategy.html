<!doctype html><html><head><meta charset="utf-8"><title>Maintenance Strategy</title><style>body{font-family:system-ui;margin:24px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}.muted{color:#666}</style></head><body><h1>Maintenance Strategy Optimization</h1><p class="muted">Observed PM frequency, repeat failures and reliability-based recommendations. Recommendations do not automatically change maintenance plans.</p><div id="summary">Load with organization_id, entity_id and period_key query parameters.</div><script>async function load(){const p=new URLSearchParams(location.search);if(!p.get('organization_id'))return;const r=await fetch('/v90en/maintenance/strategy/dashboard?'+p.toString(),{credentials:'same-origin'}),j=await r.json();document.getElementById('summary').innerHTML='<h2>Average strategy score: '+j.average_strategy_score+'</h2><table><tr><th>Work centre</th><th>PM orders</th><th>Breakdowns</th><th>Repeat failures</th><th>Observed PM days</th><th>Recommended days</th><th>Change %</th><th>Score</th><th>Recommendation</th></tr>'+j.rows.map(x=>'<tr><td>'+(x.work_center_id||'All')+'</td><td>'+x.pm_orders+'</td><td>'+x.breakdown_orders+'</td><td>'+x.repeat_breakdown_orders+'</td><td>'+x.observed_pm_interval_days+'</td><td>'+x.recommended_pm_interval_days+'</td><td>'+x.interval_change_pct+'</td><td>'+x.strategy_score+'</td><td>'+x.recommendation+'</td></tr>').join('')+'</table>'}load();</script></body></html>
