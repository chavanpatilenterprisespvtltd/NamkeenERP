<!doctype html><html><head><meta charset="utf-8"><title>ERP Performance & Scalability</title><style>body{font-family:system-ui;margin:32px;max-width:1200px}button{padding:8px 14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{border:1px solid #ddd;border-radius:8px;padding:14px}.ok{font-weight:700}pre{background:#f5f5f5;padding:16px;overflow:auto}</style></head><body><h1>Performance Engineering & Scalability</h1><p>Evidence-backed baselines, load/stress runs, database hotspots, capacity and regression gates.</p><button onclick="load()">Refresh readiness</button><div id="cards" class="grid"></div><pre id="out">Loading…</pre><script>async function load(){const h={'Authorization':localStorage.getItem('erp_token')?'Bearer '+localStorage.getItem('erp_token'):''};const r=await fetch('/v90fy/performance/readiness',{headers:h});const d=await r.json();const g=d.gates||{};document.getElementById('cards').innerHTML=Object.entries(g).map(([k,v])=>`<div class="card"><b>${k}</b><div class="ok">${v?'PASS':'BLOCKED'}</div></div>`).join('');document.getElementById('out').textContent=JSON.stringify(d,null,2)}load()</script></body></html>
