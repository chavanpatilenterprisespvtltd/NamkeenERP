<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Master</title><style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#18212f}.wrap{max-width:1100px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0}nav a{margin-right:14px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}.muted{color:#6b7280}</style></head><body><div class="wrap"><nav><a href="/ui/management">Management</a><a href="/ui/products">Products</a><a href="/ui/recipes">Recipes</a><a href="/ui/procurement">Procurement</a></nav><h1>Product Master</h1><div class="card"><div class="muted">This transactional screen is connected to the Product/SKU API. Enter organization and optional entity IDs to load data.</div><p><input id="o" placeholder="Organization UUID" size="38"> <input id="e" placeholder="Entity UUID" size="38"> <button onclick="load()">Load</button></p></div><div id="out"></div></div><script>async function load(){let o=document.getElementById('o').value,e=document.getElementById('e').value;let r=await fetch('/v90bm/products?organization_id='+encodeURIComponent(o)+(e?'&entity_id='+encodeURIComponent(e):''),{headers:{Authorization:localStorage.getItem('erp_token')?'Bearer '+localStorage.getItem('erp_token'):''}});let j=await r.json();document.getElementById('out').innerHTML=Object.entries(j.items||{}).map(([k,v])=>'<div class="card"><h2>'+k+'</h2><table><tr><th>Code/SKU</th><th>Name</th><th>Active</th></tr>'+v.map(x=>'<tr><td>'+((x.code||x.sku||x.name||''))+'</td><td>'+((x.name||''))+'</td><td>'+x.active+'</td></tr>').join('')+'</table></div>').join('')}</script></body></html>
