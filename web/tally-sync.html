<!doctype html><html><head><meta charset="utf-8"><title>Tally Synchronization</title><style>body{font-family:Arial;margin:30px;max-width:1000px}input,button{padding:8px;margin:4px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body><h1>Tally Synchronization</h1><p>Company mapping, ledger mapping, export queue, acknowledgement and retry controls.</p><form id="f"><input id="org" placeholder="Organization ID" required><input id="ent" placeholder="Entity ID" required><input id="company" placeholder="Tally Company" required><button>Save Company Mapping</button></form><hr><h2>Queue</h2><button onclick="load()">Refresh</button><table><thead><tr><th>Posting</th><th>Tally Company</th><th>Status</th><th>Attempts</th><th>Last Error</th></tr></thead><tbody id="rows"></tbody></table><script>const token=localStorage.getItem('access_token')||'';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/v90co/tally/companies',{method:'POST',headers:H,body:JSON.stringify({organization_id:org.value,entity_id:ent.value,tally_company:company.value})});alert(await r.text());load()};async function load(){if(!org.value||!ent.value)return;let r=await fetch('/v90co/tally/sync?organization_id='+encodeURIComponent(org.value)+'&entity_id='+encodeURIComponent(ent.value),{headers:H});let d=await r.json();rows.innerHTML=d.items.map(x=>`<tr><td>${x.posting_id}</td><td>${x.tally_company}</td><td>${x.status}</td><td>${x.attempts}</td><td>${x.last_error||''}</td></tr>`).join('')}</script></body></html>
