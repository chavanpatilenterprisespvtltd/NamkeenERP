<!doctype html><html><head><meta charset="utf-8"><title>Food Quality & Traceability Command</title><style>body{font-family:Arial;margin:24px} .card{border:1px solid #ddd;padding:14px;margin:8px;display:inline-block;min-width:150px}h1{margin-bottom:4px}</style></head><body><h1>Food Quality & Traceability Command</h1><p>Quality release readiness, batch traceability and exception control.</p><div id="cards"></div><script>const keys=['batches_reviewed','released_batches','held_batches','failed_inspections','open_nc','open_capa','traceable_batches','traceability_pct','release_readiness_pct']; const labels={batches_reviewed:'Batches',released_batches:'Released',held_batches:'On Hold',failed_inspections:'Failed Results',open_nc:'Open NC',open_capa:'Open CAPA',traceable_batches:'Traceable',traceability_pct:'Traceability %',release_readiness_pct:'Release Readiness %'}; document.getElementById('cards').innerHTML=keys.map(k=>`<div class="card"><b>${labels[k]}</b><div>${k}</div></div>`).join('');</script></body></html>
