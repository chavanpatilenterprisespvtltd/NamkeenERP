<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Namkeen ERP v80</title><link rel="stylesheet" href="/v80/static/styles.css"></head>
<body><div class="shell"><header><h1>Namkeen ERP</h1><span>v80 Master Data Administration</span></header>
<section class="toolbar"><label>Organization ID<input id="org" placeholder="UUID"></label><label>Master Type<select id="type"></select></label><label>Search<input id="q" placeholder="code / name / SKU"></label><button id="load">Load</button><button id="new">New Change</button></section>
<main><section class="card"><h2>Masters</h2><div id="table-wrap"><table id="table"><thead><tr><th>Code/Name</th><th>ID</th><th>Version</th><th>Active</th><th>Effective</th><th>Actions</th></tr></thead><tbody></tbody></table></div></section>
<section class="card"><h2>Approval Queue</h2><div id="queue"></div></section><section class="card"><h2>History</h2><pre id="history">Select a master row.</pre></section></main>
<dialog id="changeDialog"><form method="dialog" id="changeForm"><h3>Create / Update Request</h3><input type="hidden" id="mid"><label>Action<select id="action"><option>CREATE</option><option>UPDATE</option><option>DEACTIVATE</option></select></label><label>Requester UUID<input id="requester"></label><label>Entity UUID<input id="entity"></label><label>Effective From<input id="efffrom" type="datetime-local"></label><label>Effective To<input id="effto" type="datetime-local"></label><label>Base Version<input id="basever" type="number"></label><label>JSON Data<textarea id="data">{"code":"EXAMPLE","name":"Replace me"}</textarea></label><div class="actions"><button value="cancel">Cancel</button><button id="submitChange" value="default">Submit</button></div></form></dialog>
</div><script src="/v80/static/app.js"></script></body></html>
